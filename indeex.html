<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ромашки 🌸</title>
    <style>
        /* ===== Общий фон: нежный розовый градиент ===== */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffc3d8 0%, #ffe1ec 50%, #ffb6c9 100%);
            overflow: hidden;
            position: relative;
        }

        /* ===== Плавающие цветочки на фоне ===== */
        .flower {
            position: fixed;
            font-size: 40px;
            opacity: 0.7;
            animation: floatUp linear infinite;
            pointer-events: none; /* чтобы не мешали кликам */
            z-index: 0;
            filter: drop-shadow(0 2px 4px rgba(255, 105, 180, 0.3));
        }

        /* Анимация подъёма цветочков вверх */
        @keyframes floatUp {
            0% {
                transform: translateY(110vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-20vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* ===== Контейнер с контентом ===== */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 60px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            position: relative;
            z-index: 2;
            animation: popIn 0.8s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ===== Заголовок ===== */
        h2 {
            color: #d6336c;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* ===== Поле ввода ===== */
        input {
            padding: 12px 20px;
            font-size: 18px;
            border: 2px solid #ff6b9d;
            border-radius: 30px;
            outline: none;
            width: 250px;
            text-align: center;
            transition: all 0.3s ease;
            background: white;
            color: #d6336c;
        }

        input::placeholder {
            color: #ffb6c9;
        }

        input:focus {
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.6);
            transform: scale(1.05);
            border-color: #d6336c;
        }

        /* ===== Кнопка ===== */
        button {
            display: block;
            margin: 20px auto 0;
            padding: 12px 35px;
            font-size: 18px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff477e 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 71, 126, 0.4);
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(255, 71, 126, 0.6);
            background: linear-gradient(135deg, #ff477e 0%, #ff2a6d 100%);
        }

        button:active {
            transform: scale(0.95);
        }

        /* ===== Сообщение ===== */
        #message {
            margin-top: 25px;
            font-size: 30px;
            font-weight: bold;
            color: #ff2a6d;
            min-height: 45px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 2px 10px rgba(255, 105, 180, 0.4);
        }

        #message.show {
            opacity: 1;
            transform: scale(1);
            animation: heartbeat 1.5s ease infinite;
        }

        /* Эффект биения для сообщения "Я тебя Люблю" */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.08); }
            30% { transform: scale(1); }
            45% { transform: scale(1.06); }
            60% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Фоновые цветочки создаются через JS ниже -->

    <div class="container">
        <h2>🌸 Напиши слово... 🌸</h2>
        <input type="text" id="userInput" placeholder="Введи сюда" autocomplete="off">
        <button onclick="checkWord()">Проверить</button>
        <div id="message"></div>
    </div>

    <script>
        /* ===== Проверка слова ===== */
        function checkWord() {
            const inputField = document.getElementById('userInput');
            const messageBox = document.getElementById('message');
            const userText = inputField.value.trim().toLowerCase();

            if (userText === 'ромашки' || userText === 'ромашка') {
                messageBox.textContent = 'Я тебя Люблю ❤️';
                messageBox.style.color = '#ff2a6d';
                messageBox.style.fontSize = '34px';
                messageBox.classList.add('show');
                // Добавляем праздничные цветочки при успехе
                launchFlowers();
            } else {
                messageBox.textContent = 'Попробуй ввести "Ромашки" 🌼';
                messageBox.style.color = '#a855a0';
                messageBox.style.fontSize = '24px';
                messageBox.classList.add('show');
            }
        }

        // Enter тоже работает
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') checkWord();
        });

        /* ===== Генерация фоновых цветочков ===== */
        const flowerEmojis = ['🌼', '🌸', '🌺', '💮', '🏵️', '💐', '🌷', '🌹'];

        function createFlower() {
            const flower = document.createElement('div');
            flower.className = 'flower';
            flower.textContent = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];

            // Случайная позиция по горизонтали
            flower.style.left = Math.random() * 100 + 'vw';
            // Случайный размер
            flower.style.fontSize = (Math.random() * 30 + 20) + 'px';
            // Случайная длительность анимации
            const duration = Math.random() * 10 + 8;
            flower.style.animationDuration = duration + 's';
            // Небольшая задержка, чтобы цветы появлялись не одновременно
            flower.style.animationDelay = Math.random() * 5 + 's';

            document.body.appendChild(flower);

            // Удаляем цветок после завершения анимации, чтобы не засорять DOM
            setTimeout(() => flower.remove(), (duration + 5) * 1000);
        }

        // Запускаем появление цветочков постоянно
        setInterval(createFlower, 800);
        // Сразу создаём несколько
        for (let i = 0; i < 8; i++) createFlower();

        /* ===== Взрыв цветов при правильном ответе ===== */
        function launchFlowers() {
            for (let i = 0; i < 15; i++) {
                const f = document.createElement('div');
                f.textContent = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
                f.style.position = 'fixed';
                f.style.left = '50%';
                f.style.top = '50%';
                f.style.fontSize = (Math.random() * 30 + 20) + 'px';
                f.style.pointerEvents = 'none';
                f.style.zIndex = '9999';
                f.style.transition = 'all 1.5s ease-out';

                document.body.appendChild(f);

                // Случайное направление разлёта
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 300 + 100;
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                requestAnimationFrame(() => {
                    f.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random() * 720}deg)`;
                    f.style.opacity = '0';
                });

                setTimeout(() => f.remove(), 1600);
            }
        }
    </script>

</body>
</html>
